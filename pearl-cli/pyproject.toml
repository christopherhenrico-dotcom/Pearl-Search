[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pearl-cli"
version = "1.0.0"
description = "The Pirate's Media CLI — search, browse, and play from any URL-based source"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["media", "cli", "vlc", "tui", "terminal", "video", "player"]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
    'tomli>=2.0; python_version < "3.11"',
]

[project.optional-dependencies]
ytdlp = ["yt-dlp>=2024.1.1"]
all = ["yt-dlp>=2024.1.1"]

[project.scripts]
pearl = "pearl.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/pearl-cli"

[tool.setuptools.packages.find]
include = ["pearl*"]

[tool.setuptools.package-data]
pearl = ["py.typed"]
